<!doctype html><html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>AGJ character pack</title>
<style>body{margin:0;background:#3b2d5c;overflow:hidden;font:14px sans-serif;color:#fff}#l{position:fixed;bottom:8px;width:100%;text-align:center}</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script></head>
<body><div id="l"></div><script type="module">
import * as THREE from 'three'; import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
const P=new URLSearchParams(location.search), clipSel=P.get('clip')||'Walk', close=P.has('close');
const r=new THREE.WebGLRenderer({antialias:true}); r.setSize(innerWidth,innerHeight); document.body.appendChild(r.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color('#3b2d5c');
const cam=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,100); cam.position.set(0,close?1.6:2.2,close?4:11); cam.lookAt(close?-3:0,close?1:1.1,0); if(close){cam.position.set(3.2,2,4.2);cam.lookAt(0,1,0);} if(P.has("side")){cam.position.set(14,1.8,0);cam.lookAt(0,1.1,0);}
scene.add(new THREE.HemisphereLight('#9b8cff','#2a1b3a',1.6)); const d=new THREE.DirectionalLight('#ffe3c0',2.5); d.position.set(3,6,5); scene.add(d);
const g=new THREE.Mesh(new THREE.PlaneGeometry(40,20),new THREE.MeshToonMaterial({color:'#4a3a60'})); g.rotation.x=-Math.PI/2; scene.add(g);
const grad=new THREE.DataTexture(new Uint8Array([80,160,255]),3,1,THREE.RedFormat); grad.minFilter=grad.magFilter=THREE.NearestFilter; grad.needsUpdate=true;
const toon=root=>root.traverse(o=>{if(o.isMesh)o.material=new THREE.MeshToonMaterial({color:o.material.color,emissive:o.material.emissive,gradientMap:grad});});
const names=P.get('only')?[P.get('only')]:['Survivor','Zombie','FastZombie','Brute','Soldier'], loader=new GLTFLoader(), mixers=[]; window.__info={};
const gl=await Promise.all(names.map(n=>loader.loadAsync(`characters/${n}.glb`)));
gl.forEach((g,i)=>{ toon(g.scene); g.scene.position.x=(i-(names.length-1)/2)*2.2; scene.add(g.scene);
  const m=new THREE.AnimationMixer(g.scene), clips=g.animations.map(a=>a.name);
  const pick=g.animations.find(a=>a.name===clipSel)||g.animations.find(a=>a.name===(clipSel==='Walk'?'Run':'Walk'))||g.animations[0];
  const a=m.clipAction(pick); a.play(); mixers.push({m,a});
  window.__info[names[i]]={clips,playing:pick.name,dur:+pick.duration.toFixed(2)}; });
document.getElementById('l').textContent=names.map(n=>`${n}: ${window.__info[n].playing}`).join('  ·  ');
let last=performance.now(); window.__frames=0;
r.setAnimationLoop(()=>{const now=performance.now(), dt=(now-last)/1000; last=now; mixers.forEach(x=>x.m.update(dt)); r.render(scene,cam); window.__frames++;});
window.__time=()=>mixers.map(x=>+x.a.time.toFixed(2)); window.__ready=true;
</script></body></html>
